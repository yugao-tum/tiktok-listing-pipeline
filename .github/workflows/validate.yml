name: Pipeline regression checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regression:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.12'
      - name: Run isolated pipeline tests
        run: python -X utf8 tests/流水线回归测试.py
      - name: Install collection dependencies
        run: python -m pip install -r requirements.txt
      - name: Run offline gallery collection tests
        run: python -X utf8 tests/采集范围回归测试.py
      - name: Run overview preparation tests
        run: python -X utf8 tests/初筛准备回归测试.py
